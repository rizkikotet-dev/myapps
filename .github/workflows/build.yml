name: Build & Release Desktop App

# ============================================================
# Build Matrix + Artifact + Centralized Release
#
# Flow:
#   workflow_dispatch (tanpa mengisi apa pun)
#       -> Build only
#
#   workflow_dispatch + centang "release"
#       -> Build + Release (versi OTOMATIS dari
#          src-tauri/tauri.conf.json; input "version" hanya
#          override opsional)
#
#   workflow_dispatch + versi sama dgn rilis yang ada
#       -> Rilis lama DIHAPUS lalu dipublikasikan ulang
#          (overwrite; git tag dipertahankan)
#
#   workflow_dispatch + centang "prerelease"
#       -> Rilis ditandai pre-release & tidak jadi "latest"
#
#   push tag v*
#       -> Build + Release (pre-release otomatis bila versi
#          mengandung "-", contoh v1.2.3-beta.1)
#
# Release hanya dibuat 1x oleh job "release".
# ============================================================

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override versi, contoh: v1.2.3 atau 1.2.3. Kosongkan = ambil dari src-tauri/tauri.conf.json"
        required: false
        default: ""
        type: string
      release:
        description: "Publish GitHub Release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Tandai rilis sebagai Pre-release"
        required: false
        default: false
        type: boolean

  push:
    tags:
      - "v*"
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/tauri.conf.json"
      - "package.json"
      - "src-tauri/**"
      - "scripts/**"
      - "js/**"
      - "css/**"
      - "index.html"
      - "requirements.txt"

# ============================================================
# GLOBAL ENVIRONMENT
# ============================================================

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  RUST_TOOLCHAIN: "stable"

  # Push tag:
  #   v1.2.3
  #
  # Manual:
  #   input version (kosong = ambil dari src-tauri/tauri.conf.json)
  VERSION: >-
    ${{ github.event_name == 'push'
      && github.ref_name
      || github.event.inputs.version }}

# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# JOBS
# ============================================================

jobs:

  # ==========================================================
  # BUILD
  # ==========================================================

  build:
    name: Build (${{ matrix.label }})

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false

      matrix:
        include:

          # --------------------------------------------------
          # Windows x86_64
          # --------------------------------------------------

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: "Windows x86_64"

          # --------------------------------------------------
          # macOS Apple Silicon
          # --------------------------------------------------

          - os: macos-latest
            target: aarch64-apple-darwin
            label: "macOS Apple Silicon"

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ======================================================
      # VALIDATE PROJECT
      # ======================================================

      - name: Validate Project Structure
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "Validating project structure"
          echo "=============================================="

          required_files=(
            "package.json"
            "package-lock.json"
            "requirements.txt"
            "scripts/build_sidecar.py"
            "src-tauri/tauri.conf.json"
            "src-tauri/Cargo.toml"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required file not found: $file"
              exit 1
            fi
          done

          echo "Project structure OK."

      # ======================================================
      # SYNC VERSION FROM CARGO.TOML
      # ======================================================

      - name: Sync Version from Cargo.toml
        id: cargo-version
        shell: bash
        run: |
          set -e

          # Read version from Cargo.toml (source of truth)
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Cargo.toml version: $CARGO_VERSION"

          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::Could not read version from Cargo.toml"
            exit 1
          fi

          # Sync to package.json
          if [ -f "package.json" ]; then
            python3 -c "import json, os; pkg = json.load(open('package.json', encoding='utf-8')); pkg['version'] = os.getenv('CARGO_VERSION'); json.dump(pkg, open('package.json', 'w', encoding='utf-8'), indent=2); open('package.json', 'a').write('\n'); print('package.json version synced')"
          fi

          # Sync to tauri.conf.json
          if [ -f "src-tauri/tauri.conf.json" ]; then
            python3 -c "import json, os; cfg = json.load(open('src-tauri/tauri.conf.json', encoding='utf-8')); cfg['version'] = os.getenv('CARGO_VERSION'); json.dump(cfg, open('src-tauri/tauri.conf.json', 'w', encoding='utf-8'), indent=2, ensure_ascii=False); open('src-tauri/tauri.conf.json', 'a').write('\n'); print('tauri.conf.json version synced')"
          fi

          echo "cargo_version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version synced across all files: $CARGO_VERSION"

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python Dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install \
            pyinstaller \
            -r requirements.txt

      # ======================================================
      # ROBLOX OAUTH CONFIG
      # ======================================================

      - name: Generate Roblox OAuth Configuration
        env:
          RBX_CLIENT_ID: ${{ secrets.client_id }}
          RBX_CLIENT_SECRET: ${{ secrets.client_secret }}
          RBX_REDIRECT_URI: ${{ secrets.redirect_uri }}
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          client_id = os.getenv("RBX_CLIENT_ID", "").strip()
          client_secret = os.getenv("RBX_CLIENT_SECRET", "").strip()
          redirect_uri = os.getenv(
              "RBX_REDIRECT_URI",
              "http://localhost:55502/callback"
          ).strip()

          output = Path("roblox_config.json")

          if not client_id or not client_secret:
              print(
                  "::warning::"
                  "Roblox OAuth secrets tidak tersedia. "
                  "Build akan berjalan tanpa OAuth configuration."
              )

              # Pastikan config lama tidak ikut terbawa.
              if output.exists():
                  output.unlink()

          else:
              config = {
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "redirect_uri": redirect_uri,
              }

              output.write_text(
                  json.dumps(config, indent=4),
                  encoding="utf-8",
              )

              print("::notice::Roblox OAuth configuration generated.")
          PY

      # ======================================================
      # NORMALIZE VERSION
      # ======================================================

      - name: Normalize Version
        id: version
        shell: bash
        run: |
          set -e

          # Use Cargo.toml version as source of truth
          RAW_VERSION="${{ steps.cargo-version.outputs.cargo_version }}"
          echo "Using version from Cargo.toml: $RAW_VERSION"

          # Ensure version starts with v for release tag.
          if [[ "$RAW_VERSION" != v* ]]; then
            RAW_VERSION="v${RAW_VERSION}"
          fi

          VERSION_NUMBER="${RAW_VERSION#v}"

          # Basic semantic version validation.
          if [[ ! "$VERSION_NUMBER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $RAW_VERSION"
            echo "::error::Expected format: v1.2.3"
            exit 1
          fi

          # Release hanya saat push tag, atau dispatch dengan centang "release".
          IS_RELEASE="false"
          if [ "${{ github.event_name }}" = "push" ]; then
            IS_RELEASE="true"
          elif [ "${{ github.event.inputs.release }}" = "true" ]; then
            IS_RELEASE="true"
          fi

          echo "version=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

          echo "Release version : $VERSION_NUMBER"
          echo "Release tag     : $RAW_VERSION"

          if [ "$IS_RELEASE" = "true" ]; then
            echo "Mode            : BUILD + RELEASE"
          else
            echo "Mode            : BUILD ONLY"
          fi

      # ======================================================
      # UPDATE TAURI VERSION (already synced)
      # ======================================================

      - name: Verify Version Consistency
        shell: bash
        run: |
          set -e

          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAURI_VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json',encoding='utf-8'))['version'].strip())")
          PKG_VERSION=$(python3 -c "import json; print(json.load(open('package.json',encoding='utf-8'))['version'].strip())")

          echo "Cargo.toml     : $CARGO_VERSION"
          echo "tauri.conf.json: $TAURI_VERSION"
          echo "package.json   : $PKG_VERSION"

          if [ "$CARGO_VERSION" != "$TAURI_VERSION" ] || [ "$CARGO_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch detected!"
            exit 1
          fi

          echo "All versions consistent: $CARGO_VERSION"

      # ======================================================
      # BUILD PYTHON SIDECAR
      # ======================================================

      - name: Build Python Sidecar
        shell: bash
        run: |
          set -e

          echo "Building Python sidecar..."

          python scripts/build_sidecar.py

          echo "Python sidecar build completed."

      # ======================================================
      # RUST
      # ======================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          shared-key: ${{ matrix.target }}

      # ======================================================
      # NODE
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      # ======================================================
      # BUILD TAURI
      # ======================================================

      - name: Build Tauri Application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "Building Tauri"
          echo "Target: ${{ matrix.target }}"
          echo "=============================================="

          # Valid key = raw minisign text ATAU base64 dari "untrusted comment:"
          case "$TAURI_SIGNING_PRIVATE_KEY" in
            "untrusted comment:"*|"dW50cnVzdGVkIGNvbW1lbnQ6"*)
              echo "Updater signing key detected."
              ;;
            *)
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY is malformed."
              echo "Paste the FULL contents of tauri.key (one base64 line) into the secret."
              echo "Building without updater signing."
              unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
              ;;
          esac

          npx tauri build \
            --target "${{ matrix.target }}"

      # ======================================================
      # SHOW BUILD OUTPUT
      # ======================================================

      - name: Inspect Build Output
        shell: bash
        run: |
          set +e

          echo "=============================================="
          echo "Build Output"
          echo "=============================================="

          if [ -d "src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
            find \
              "src-tauri/target/${{ matrix.target }}/release/bundle" \
              -type f \
              -print
          else
            echo "::warning::Bundle directory not found."
          fi

      # ======================================================
      # PACKAGE BUILD ARTIFACT
      # ======================================================

      - name: Prepare Build Artifact
        shell: bash
        run: |
          set -e

          TARGET_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          OUTPUT_DIR="artifacts/${{ matrix.target }}"

          mkdir -p "$OUTPUT_DIR"

          # --------------------------------------------------
          # Windows
          # --------------------------------------------------

          if [ -d "$TARGET_DIR/nsis" ]; then
            find "$TARGET_DIR/nsis" \
              -type f \
              \( -name "*.exe" -o -name "*.sig" \) \
              -exec cp {} "$OUTPUT_DIR/" \;
          fi

          if [ -d "$TARGET_DIR/msi" ]; then
            find "$TARGET_DIR/msi" \
              -type f \
              \( -name "*.msi" -o -name "*.sig" \) \
              -exec cp {} "$OUTPUT_DIR/" \;
          fi

          # --------------------------------------------------
          # macOS
          # --------------------------------------------------

          if [ -d "$TARGET_DIR/dmg" ]; then
            find "$TARGET_DIR/dmg" \
              -type f \
              \( -name "*.dmg" -o -name "*.sig" \) \
              -exec cp {} "$OUTPUT_DIR/" \;
          fi

          # --------------------------------------------------
          # macOS updater bundle (.app.tar.gz dibuat di bundle/macos/)
          # --------------------------------------------------

          if [ -d "$TARGET_DIR/macos" ]; then
            find "$TARGET_DIR/macos" \
              -maxdepth 1 \
              -type f \
              \( -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \) \
              -exec cp {} "$OUTPUT_DIR/" \;
          fi

          # --------------------------------------------------
          # Updater
          # --------------------------------------------------

          if [ -d "$TARGET_DIR/updater" ]; then
            find "$TARGET_DIR/updater" \
              -type f \
              -exec cp {} "$OUTPUT_DIR/" \;
          fi

          echo "=============================================="
          echo "Prepared artifacts:"
          echo "=============================================="

          find "$OUTPUT_DIR" -type f -print

      # ======================================================
      # UPLOAD BUILD ARTIFACT
      # ======================================================

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  # ==========================================================
  # RELEASE
  # ==========================================================

  release:
    name: Publish GitHub Release

    needs:
      - build

    if: >-
      ${{
        github.event_name == 'push'
        ||
        (
          github.event_name == 'workflow_dispatch'
          &&
          github.event.inputs.release == 'true'
        )
      }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ======================================================
      # NORMALIZE VERSION
      # ======================================================

      - name: Resolve Release Version
        id: release
        shell: bash
        run: |
          set -e

          # Source of truth: Cargo.toml version
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            # push tag takes priority
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "$(echo '${{ github.event.inputs.version }}' | xargs)" ]; then
            # manual override
            TAG="${{ github.event.inputs.version }}"
            [[ "$TAG" != v* ]] && TAG="v${TAG}"
          else
            # auto: Cargo.toml version
            TAG="v${CARGO_VERSION}"
            echo "Versi dari src-tauri/Cargo.toml : $TAG"
          fi

          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi

          # Pre-release: input "prerelease" (dispatch), atau versi mengandung
          # "-" (push tag, contoh v1.2.3-beta.1).
          PRERELEASE="false"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            [[ "$VERSION" == *-* ]] && PRERELEASE="true"
          elif [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            PRERELEASE="true"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          echo "Release tag     : $TAG"
          echo "Release version : $VERSION"
          echo "Pre-release     : $PRERELEASE"

      # ======================================================
      # DOWNLOAD ALL BUILD ARTIFACTS
      # ======================================================

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-x86_64-pc-windows-msvc
          path: release-assets/windows

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-aarch64-apple-darwin
          path: release-assets/macos

      # ======================================================
      # SHOW RELEASE FILES
      # ======================================================

      - name: Inspect Release Assets
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "Release Assets"
          echo "=============================================="

          find release-assets \
            -type f \
            -print \
            | sort

      # ======================================================
      # VALIDATE RELEASE ASSETS
      # ======================================================

      - name: Validate Release Assets
        shell: bash
        run: |
          set -e

          FILE_COUNT="$(find release-assets -type f | wc -l)"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No release assets found."
            exit 1
          fi

          echo "Found $FILE_COUNT release files."

      # ======================================================
      # GENERATE CHECKSUMS
      # ======================================================

      - name: Generate SHA256 Checksums
        shell: bash
        run: |
          set -e

          cd release-assets

          find . \
            -type f \
            ! -name "SHA256SUMS.txt" \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS.txt

          echo "SHA256SUMS.txt generated."

          cat SHA256SUMS.txt

      # ======================================================
      # FLATTEN ASSETS
      # ======================================================

      - name: Prepare Release Assets
        shell: bash
        run: |
          set -e

          mkdir -p final-release

          # Windows
          find release-assets/windows \
            -type f \
            -exec cp {} final-release/ \;

          # macOS
          find release-assets/macos \
            -type f \
            -exec cp {} final-release/ \;

          # Checksums
          cp release-assets/SHA256SUMS.txt final-release/

          echo "=============================================="
          echo "Final Release Files"
          echo "=============================================="

          find final-release \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

      # ======================================================
      # GENERATE UPDATER MANIFEST
      # ======================================================

      - name: Generate Updater Manifest (latest.json)
        env:
          REL_TAG: ${{ steps.release.outputs.tag }}
          REL_VERSION: ${{ steps.release.outputs.version }}
          BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import glob, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          base = os.environ["BASE_URL"].rstrip("/")

          def one(pattern):
              matches = sorted(glob.glob(os.path.join("final-release", pattern)))
              if not matches:
                  raise SystemExit(
                      f"::error::Updater artifact tidak ditemukan: {pattern} — "
                      "pastikan bundle dihasilkan dengan createUpdaterArtifacts=true"
                  )
              return matches[0]

          win = one("*-setup.exe")
          mac = one("*.app.tar.gz")

          sigs = {}
          for label, path in (("windows-x86_64", win), ("darwin-aarch64", mac)):
              sig_path = path + ".sig"
              if not os.path.isfile(sig_path):
                  raise SystemExit(
                      f"::error::Signature updater hilang: {os.path.basename(sig_path)} — "
                      "cek secret TAURI_SIGNING_PRIVATE_KEY"
                  )
              sigs[label] = (path, Path(sig_path).read_text(encoding="utf-8").strip())

          version = os.environ["REL_VERSION"]

          manifest = {
              "version": version,
              "notes": f"Desktop App v{version}",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  platform: {
                      "signature": signature,
                      "url": f"{base}/{quote(os.path.basename(path))}",
                  }
                  for platform, (path, signature) in sigs.items()
              },
          }

          out = Path("final-release/latest.json")
          out.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          print(out.read_text(encoding="utf-8"))
          PY

          echo "latest.json generated."

      # ======================================================
      # OVERWRITE: hapus rilis lama dengan versi sama
      # (git tag dipertahankan agar push-tag tidak retarget)
      # ======================================================

      - name: Remove Existing Release (same version)
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -e

          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            echo "::notice::Rilis $REL_TAG sudah ada — dihapus untuk dipublikasikan ulang."
            gh release delete "$REL_TAG" --yes
          else
            echo "Belum ada rilis $REL_TAG — akan dibuat baru."
          fi

      # ======================================================
      # PUBLISH RELEASE
      # ======================================================

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: "Desktop App ${{ steps.release.outputs.tag }}"

          generate_release_notes: true

          draft: false

          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}

          # Pre-release tidak boleh menjadi "latest" agar endpoint updater
          # (releases/latest/download/latest.json) tetap menunjuk rilis stabil.
          make_latest: ${{ steps.release.outputs.prerelease == 'true' && 'false' || 'true' }}

          files: |
            final-release/*
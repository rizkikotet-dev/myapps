name: Build & Release Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi rilis (mis. v1.2.3) — kosongkan untuk build tanpa rilis"
        required: false
        default: ""
  push:
    tags:
      - "v*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: "Windows x86_64"
          - os: macos-latest
            target: aarch64-apple-darwin
            label: "macOS Apple Silicon"

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Generate Roblox OAuth Configuration
        env:
          RBX_CLIENT_ID: ${{ secrets.client_id }}
          RBX_CLIENT_SECRET: ${{ secrets.client_secret }}
          RBX_REDIRECT_URI: ${{ secrets.redirect_uri }}
        shell: bash
        run: |
          # Improvisasi: Menggunakan Python untuk generate JSON agar terhindar dari error indentasi/spasial pada bash
          python - <<'PY'
          import json, os
          
          client_id = os.getenv("RBX_CLIENT_ID", "")
          client_secret = os.getenv("RBX_CLIENT_SECRET", "")
          redirect_uri = os.getenv("RBX_REDIRECT_URI", "http://localhost:55502/callback")

          if not client_id or not client_secret:
              print("::warning::Secrets 'client_id' atau 'client_secret' belum diset. Build berjalan TANPA OAuth Roblox.")
          else:
              config = {
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "redirect_uri": redirect_uri
              }
              with open("roblox_config.json", "w", encoding="utf-8") as f:
                  json.dump(config, f, indent=4)
              print("::notice::roblox_config.json berhasil dibuat.")
          PY

      - name: Change Version Tauri Config
        shell: bash
        run: |
          if [ -n "${{ env.VERSION }}" ]; then
            echo "Mengubah versi di tauri.conf.json menjadi ${{ env.VERSION }}"
            python - <<'PY'
            import json, os

            version = os.getenv("VERSION", "")
            if version:
                with open("src-tauri/tauri.conf.json", "r+", encoding="utf-8") as f:
                    config = json.load(f)
                    config["version"] = version.lstrip("v")
                    f.seek(0)
                    json.dump(config, f, indent=4)
                    f.truncate()
                print(f"Versi di tauri.conf.json diubah menjadi {version.lstrip('v')}")
            else:
                print("Tidak ada versi yang diberikan. Menggunakan versi default di tauri.conf.json.")
            PY
          else
            echo "Tidak ada versi yang diberikan. Menggunakan versi default di tauri.conf.json."
          fi

      - name: Build Python Sidecar
        run: python scripts/build_sidecar.py

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install JavaScript Dependencies
        run: npm ci

      - name: Build Tauri App (signed for updater)
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        shell: bash
        run: |
          # private key updater dari secret repo (minisign, tanpa password)
          echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > "$RUNNER_TEMP/updater.key"
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/updater.key")"
          npx tauri build --target ${{ matrix.target }}
          rm -f "$RUNNER_TEMP/updater.key"

      - name: Upload Build Artifacts (Debug/Non-Release)
        if: env.VERSION == ''
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
          if-no-files-found: warn
          retention-days: 7

      - name: Collect updater artifacts
        if: env.VERSION != ''
        shell: bash
        run: |
          # kumpulkan latest.json per-platform (nama file unik agar tidak saling timpa)
          mkdir -p updater-out
          found=0
          for f in src-tauri/target/*/release/bundle/updater/latest.json; do
            [ -f "$f" ] || continue
            found=1
            plat=$(basename "$(dirname "$(dirname "$(dirname "$f")")")")
            cp "$f" "updater-out/latest-${plat}.json"
          done
          [ "$found" = "1" ] || echo "::warning::Tidak ada latest.json — updater artifacts kosong?"

      - name: Upload updater JSON artifact
        if: env.VERSION != ''
        uses: actions/upload-artifact@v4
        with:
          name: updater-json-${{ matrix.target }}
          path: updater-out/*.json
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: env.VERSION != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            updater-out/*.json
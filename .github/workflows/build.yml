name: Build Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi rilis (mis. v1.2.3) — kosongkan untuk build tanpa rilis"
        required: false
        default: ""
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
          - os: macos-13 # Intel
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Generate roblox_config.json dari secrets
        env:
          RBX_CLIENT_ID: ${{ secrets.client_id }}
          RBX_CLIENT_SECRET: ${{ secrets.client_secret }}
          RBX_REDIRECT_URI: ${{ secrets.redirect_uri }}
        shell: bash
        run: |
          if [ -z "$RBX_CLIENT_ID" ] || [ -z "$RBX_CLIENT_SECRET" ]; then
            echo "::warning::Secrets 'client_id' / 'client_secret' belum diset — build jalan TANPA OAuth Roblox"
            exit 0
          fi
          cat > roblox_config.json <<EOF
          {
            "client_id": "$RBX_CLIENT_ID",
            "client_secret": "$RBX_CLIENT_SECRET",
            "redirect_uri": "${RBX_REDIRECT_URI:-http://localhost:55502/callback}"
          }
          EOF

      - name: Build Python sidecar (hidden-audio-server)
        run: python scripts/build_sidecar.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Build Tauri app (${{ matrix.target }})
        run: npx tauri build --target ${{ matrix.target }}

      - name: Release (jika VERSION diset — tag push atau input workflow_dispatch)
        if: env.VERSION != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          draft: false
          files: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg

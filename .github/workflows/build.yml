name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
          - os: macos-13 # Intel
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Generate roblox_config.json dari secrets
        env:
          RBX_CLIENT_ID: ${{ secrets.client_id }}
          RBX_CLIENT_SECRET: ${{ secrets.client_secret }}
          RBX_REDIRECT_URI: ${{ secrets.redirect_uri }}
        shell: bash
        run: |
          if [ -z "$RBX_CLIENT_ID" ] || [ -z "$RBX_CLIENT_SECRET" ]; then
            echo "::warning::Secrets 'client_id' / 'client_secret' belum diset — build jalan TANPA OAuth Roblox"
            exit 0
          fi
          cat > roblox_config.json <<EOF
          {
            "client_id": "$RBX_CLIENT_ID",
            "client_secret": "$RBX_CLIENT_SECRET",
            "redirect_uri": "${RBX_REDIRECT_URI:-http://localhost:55502/callback}"
          }
          EOF
          echo "roblox_config.json dibuat (redirect: ${RBX_REDIRECT_URI:-http://localhost:55502/callback})"

      - name: Build Python sidecar (hidden-audio-server)
        run: python scripts/build_sidecar.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux deps (webkit2gtk-4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm ci

      - name: Build Tauri app (${{ matrix.target }})
        run: npx tauri build --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hidden-audio-converter-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

      - name: Release (tag push saja)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg

[package]
name = "valency-studio-audio-converter"
version = "1.0.0"
description = "Valency Studio | Audio Converter — batch konversi audio ke OGG Vorbis dengan trik sample-rate, plus upload ke Roblox"
edition = "2021"

[lib]
name = "valency_studio_audio_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
